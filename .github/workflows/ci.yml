name: CI

on:
    pull_request:

jobs:
    lint-and-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Build
              run: bun run build
